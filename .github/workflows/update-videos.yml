name: Update XVideos Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest CSV
        run: |
          curl -L \
            https://public-assets.xvideos-cdn.com/webmaster-tools/xvideos.com-export-full.csv.zip \
            -o export.zip

      - name: Extract CSV
        run: |
          unzip -o export.zip
          mv xvideos.com-export-full.csv videos.csv

      - name: Convert CSV to JSON
        run: |
          python convert.py

      - name: Remove temporary files
        run: |
          rm -f export.zip videos.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update videos.json"
          git push
