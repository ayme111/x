name: Update XVideos Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip gzip

      - name: Download latest CSV
        run: |
          curl -L \
            https://public-assets.xvideos-cdn.com/webmaster-tools/xvideos.com-export-full.csv.zip \
            -o export.zip

      - name: Extract CSV
        run: |
          unzip -o export.zip
          mv xvideos.com-export-full.csv videos.csv

      - name: Convert CSV to JSON
        run: |
          python convert.py

      - name: Compress JSON
        run: |
          gzip -9 videos.json
          ls -lh videos.json.gz

      - name: Upload compressed database to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **
            !videos.json.gz

      - name: Cleanup
        run: |
          rm -f export.zip videos.csv videos.json.gz
